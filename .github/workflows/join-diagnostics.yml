name: Validate public mobile connection
on:
  push:
    branches: [fix/arena-join-recovery, feature/compact-lobby-touch-zone, feature/onehand-flow-performance, main]
    paths:
      [
        client/main.js,
        client/websocket.js,
        client/transport.js,
        client/network-mode.js,
        client/controls.js,
        client/progression.js,
        tests/community.browser.js,
        client/lobby.css,
        client/expansion.css,
        index.html,
        tests/join.browser.js,
        tests/lobby.browser.js,
        tests/forest.browser.js,
        .github/workflows/join-diagnostics.yml,
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_TEST_URL: https://orman-arrow-archer.cangunes1995.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 6
      - name: Play the compact lobby and bounded floating controls on Chrome and Safari
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm start > /tmp/lobby-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then break; fi
            sleep 1
          done
          npm run test:lobby
          npm run test:forest
          npm run test:battle-royale
          npm run test:hud
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:lobby
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:forest
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:battle-royale
      - name: Verify stalled requests, cancellation and fresh-seat recovery in the real Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          WRANGLER_SEND_METRICS=false npm run dev:cloudflare > /tmp/join-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8787/health; then break; fi
            sleep 1
          done
          JOIN_RECOVERY_TESTS=1 CLOUDFLARE_TEST_URL=http://127.0.0.1:8787 node tests/join.browser.js
          JOIN_RECOVERY_TESTS=1 CLOUDFLARE_TEST_URL=http://127.0.0.1:8787 LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit node tests/join.browser.js
          CLOUDFLARE_TEST_URL=http://127.0.0.1:8787 npm run test:battle-royale:runtime
          CLOUDFLARE_TEST_URL=http://127.0.0.1:8787 npm run test:multimode
          CLOUDFLARE_TEST_URL=http://127.0.0.1:8787 npm run test:community
      - name: Verify this client version is deployed
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          npm run build:cloudflare
          read_asset='const fs=require("node:fs");const html=fs.readFileSync(process.argv[1],"utf8");const src=html.match(/<script[^>]*src="([^"]+\.js)"/);if(!src)process.exit(1);console.log(src[1].split("/").at(-1));'
          expected=$(node -e "$read_asset" dist-cloudflare/index.html)
          matched=false
          for attempt in {1..36}; do
            if curl --fail --silent "$CLOUDFLARE_TEST_URL/" -o /tmp/join-live.html; then
              actual=$(node -e "$read_asset" /tmp/join-live.html || true)
              if test "$actual" = "$expected"; then matched=true; break; fi
            fi
            sleep 5
          done
          test "$matched" = true
          echo "JOIN_RECOVERY_TESTS=1" >> "$GITHUB_ENV"
      - name: Check current public quick join and returning mobile sessions
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then npm run test:battle-royale:runtime; fi
          node tests/join.browser.js
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit node tests/join.browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-join-screenshots
          path: /tmp/archer-validation/join-*.png
          if-no-files-found: ignore
