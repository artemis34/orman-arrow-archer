name: Validate and publish
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Validate production server and desktop/mobile controls
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/archer-server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then break; fi
            sleep 1
          done
          npm run test:network
          npm run test:browser
          npm run test:hud
          npm run test:audio
          npm run test:powerups
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/archer-validation
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Check optional GitHub Pages configuration
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({ owner: context.repo.owner, repo: context.repo.repo });
              return true;
            } catch (error) {
              if (error.status === 404 || error.status === 403) {
                core.notice('Pages is not enabled. The free CDN edition is published independently.');
                return false;
              }
              throw error;
            }
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.result == 'true'
        with:
          path: dist
  static:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Publish immutable static assets
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify public CDN deployment
        shell: bash
        run: |
          set -euo pipefail
          site_commit=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
          test -n "$site_commit"
          site_url="https://rawcdn.githack.com/${GITHUB_REPOSITORY}/${site_commit}/index.html"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$site_url" -o /tmp/live-index.html
          grep -q 'Wildbow' /tmp/live-index.html
          asset_path=$(sed -n 's/.*src="\.\/\([^"]*\.js\)".*/\1/p' /tmp/live-index.html | head -1)
          test -n "$asset_path"
          curl --fail --location --retry 4 --retry-delay 3 "${site_url%index.html}${asset_path}" -o /tmp/live-entry.js
          test -s /tmp/live-entry.js
          echo "### Live practice edition" >> "$GITHUB_STEP_SUMMARY"
          echo "$site_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified HTML and JavaScript assets over HTTPS. Online multiplayer requires a separately hosted Node server." >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_SITE_URL=$site_url"
          echo "LIVE_SITE_URL=$site_url" >> "$GITHUB_ENV"
      - name: Play the published desktop and mobile game
        run: npm run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-screenshots
          path: /tmp/archer-live
          if-no-files-found: ignore
  pages:
    if: github.event_name != 'pull_request' && needs.validate.outputs.pages_enabled == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
