name: Validate and publish
on:
  push:
    branches:
      [
        main,
        feature/cloudflare-arena-refresh,
        feature/team-progression,
        feature/render-performance,
        optimization/platform-safe-2026-10-21,
        fix/projectile-motion-bot-recovery,
        feature/forest-ranked-social,
        feature/bow-buff-effects,
        feature/kill-streak,
        feature/onehand-flow-performance,
        optimization/frame-pacing-2026-10-23,
      ]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    # Match package-lock's Playwright version; browsers and OS libraries are
    # preinstalled, avoiding repeated apt/CDN installation stalls.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 20
    outputs:
      pages_enabled: ${{ steps.pages.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Validate full-quality renderer budgets and resource reuse
        run: |
          npm run test:performance
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:performance
          npm run test:player-labels
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:player-labels
          npm run test:opaque-depth
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:opaque-depth
          npm run test:projectiles
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:projectiles
          npm run test:bow-buffs
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:bow-buffs
      - name: Validate production server and desktop/mobile controls
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/archer-server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then break; fi
            sleep 1
          done
          npm run test:network
          npm run test:browser
          npm run test:hud
          npm run test:battle-royale
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:battle-royale
          npm run test:audio
          npm run test:powerups
          npm run test:interaction
          npm run test:motion
          npm run test:lobby
          npm run test:forest
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:forest
          npm run test:kill-streak
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:kill-streak
          npm run test:expansion
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:lobby
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:expansion
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:interaction
      - name: Validate Cloudflare rooms and desktop/mobile multiplayer
        shell: bash
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npm run dev:cloudflare > /tmp/cloudflare-server.log 2>&1 &
          cloudflare_pid=$!
          trap 'kill "$cloudflare_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/health
          npm run test:cloudflare
          npm run test:multimode
          npm run test:battle-royale:runtime
          npm run test:profile
          npm run test:community
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:community
          npm run test:community:runtime
          JOIN_RECOVERY_TESTS=1 npm run test:join
          JOIN_RECOVERY_TESTS=1 LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:join
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cloudflare-runtime-log
          path: /tmp/cloudflare-server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/archer-validation
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Check optional GitHub Pages configuration
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({ owner: context.repo.owner, repo: context.repo.repo });
              return true;
            } catch (error) {
              if (error.status === 404 || error.status === 403) {
                core.notice('Pages is not enabled. The free CDN edition is published independently.');
                return false;
              }
              throw error;
            }
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.result == 'true'
        with:
          path: dist
  multiplayer:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Play two independent browsers against a fresh Worker
        shell: bash
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npm run dev:cloudflare > /tmp/cloudflare-multiplayer.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/health
          npm run test:cloudflare:browser
          LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_ENGINE=webkit npm run test:cloudflare:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-multiplayer-diagnostics
          path: |
            /tmp/cloudflare-multiplayer.log
            /tmp/archer-validation/cloudflare-*.png
          if-no-files-found: ignore
  static:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, multiplayer]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Publish immutable static assets
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read the published static revision
        id: static_revision
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/gh-pages',
            });
            core.setOutput('sha', data.object.sha);
      - name: Verify public CDN deployment
        env:
          STATIC_SITE_COMMIT: ${{ steps.static_revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STATIC_SITE_COMMIT"
          site_url="https://rawcdn.githack.com/${GITHUB_REPOSITORY}/${STATIC_SITE_COMMIT}/index.html"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$site_url" -o /tmp/live-index.html
          grep -q 'Wildbow' /tmp/live-index.html
          asset_path=$(sed -n 's/.*src="\.\/\([^"]*\.js\)".*/\1/p' /tmp/live-index.html | head -1)
          test -n "$asset_path"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 120 "${site_url%index.html}${asset_path}" -o /tmp/live-entry.js
          test -s /tmp/live-entry.js
          echo "### Live practice edition" >> "$GITHUB_STEP_SUMMARY"
          echo "$site_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified HTML and JavaScript assets over HTTPS. Online multiplayer requires a Cloudflare or Node game server." >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_SITE_URL=$site_url"
          echo "LIVE_SITE_URL=$site_url" >> "$GITHUB_ENV"
      - name: Play the published desktop and mobile game
        run: npm run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-screenshots
          path: /tmp/archer-live
          if-no-files-found: ignore
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.validate.outputs.pages_enabled == 'true'
    needs: [validate, multiplayer]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  cloudflare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, multiplayer]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check Cloudflare account bindings
        id: account
        shell: bash
        run: |
          if test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloudflare code and local multiplayer tests are ready. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable account deployment.'
          fi
      - uses: actions/checkout@v4
        if: steps.account.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.account.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.account.outputs.ready == 'true'
      - name: Publish Cloudflare arena
        if: steps.account.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:cloudflare | tee /tmp/cloudflare-deploy.log
          site_url=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const url=readFileSync("/tmp/cloudflare-deploy.log","utf8").match(/https:\/\/[a-zA-Z0-9.-]+\.workers\.dev/); if(!url) process.exit(1); process.stdout.write(url[0]);')
          curl --fail --silent --retry 5 --retry-delay 3 "$site_url/health"
          echo "CLOUDFLARE_TEST_URL=$site_url" >> "$GITHUB_ENV"
          echo "Cloudflare online arena: $site_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Play the deployed Cloudflare multiplayer game
        if: steps.account.outputs.ready == 'true'
        run: |
          npm run test:cloudflare
          npm run test:cloudflare:browser
  cloudflare-live:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'artemis34/orman-arrow-archer'
    needs: [validate, cloudflare]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    env:
      CLOUDFLARE_TEST_URL: ${{ vars.CLOUDFLARE_SITE_URL || 'https://orman-arrow-archer.cangunes1995.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Wait for Cloudflare GitHub deployment to serve this client build
        shell: bash
        run: |
          set -euo pipefail
          read_asset='const fs = require("node:fs"); const html = fs.readFileSync(process.argv[1], "utf8"); const src = html.match(/<script[^>]*src="([^"]+\.js)"/); if (!src) process.exit(1); console.log(src[1].split("/").at(-1));'
          expected_asset=$(node -e "$read_asset" dist-cloudflare/index.html)
          matched=false
          for attempt in {1..24}; do
            if curl --fail --silent "$CLOUDFLARE_TEST_URL/" -o /tmp/live-cloudflare-index.html; then
              actual_asset=$(node -e "$read_asset" /tmp/live-cloudflare-index.html || true)
              if test "$actual_asset" = "$expected_asset"; then matched=true; break; fi
            fi
            sleep 5
          done
          if test "$matched" != true; then
            echo '::error::Cloudflare has not served this client build yet. Check the connected main-branch build in the Cloudflare dashboard.'
            exit 1
          fi
          curl --fail --silent --show-error "$CLOUDFLARE_TEST_URL/health"
          echo "### Verified Cloudflare release" >> "$GITHUB_STEP_SUMMARY"
          echo "$CLOUDFLARE_TEST_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Client asset: $expected_asset" >> "$GITHUB_STEP_SUMMARY"
      - name: Play public Cloudflare multiplayer on desktop and phone
        run: |
          npm run test:cloudflare
          npm run test:cloudflare:browser
          npm run test:multimode
          npm run test:battle-royale:runtime
          npm run test:profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-live-screenshots
          path: /tmp/archer-validation
          if-no-files-found: ignore
